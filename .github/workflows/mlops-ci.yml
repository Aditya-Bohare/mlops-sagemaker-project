name: MLOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  train-and-evaluate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: |
          python src/train.py

      - name: Verify trained model
        run: |
          ls -lh model/
          test -f model/model.joblib

      - name: Evaluate model
        run: |
          python src/evaluate.py

      - name: Package model
        run: |
          tar -czf model/model.tar.gz -C model model.joblib

      - name: Verify model package
        run: |
          ls -lh model/
          tar -tzf model/model.tar.gz
      
      - name: Upload MLOps artifacts
        uses: actions/upload-artifact@v4
        with:
          name: churn-model-artifacts
          path: |
            model/model.tar.gz
            artifacts/metrics.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::923357842396:role/GitHubActionsRole
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity