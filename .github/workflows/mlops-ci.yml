name: MLOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  train-and-evaluate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: |
          python src/train.py

      - name: Verify trained model
        run: |
          ls -lh model/
          test -f model/model.joblib

      - name: Evaluate model
        run: |
          python src/evaluate.py

      - name: Package model
        run: |
          tar -czf model/model.tar.gz -C model model.joblib

      - name: Verify model package
        run: |
          ls -lh model/
          tar -tzf model/model.tar.gz